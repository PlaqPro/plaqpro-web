  <script>
  // Etendre la sidebar et navigate pour inclure le calculateur
  document.addEventListener('DOMContentLoaded', function() {

    // Surcharger renderSidebar
    const nav = [
      { page:'dashboard', icon:'🏠', label:'Tableau de bord' },
      { page:'calcExpressV2', icon:'⚡', label:'Nouveau chiffrage' },
      { section:'📂 Gestion' },
      { page:'clients', icon:'👥', label:'Clients' },
      { page:'chantiers', icon:'🏗', label:'Chantiers' },
      { page:'sousTraitants', icon:'🤝', label:'Sous-traitants' },
      { page:'calendrier', icon:'📅', label:'Calendrier' },
      { page:'prospection', icon:'📡', label:'Prospection IA' },
      { page:'dpgf', icon:'🏛', label:'Appels d\'offres' },
      { section:'📄 Commercial' },
      { page:'listeDevis', icon:'📄', label:'Devis' },
      { page:'factures', icon:'🧾', label:'Factures' },
      { page:'historiqueChiffrages', icon:'📊', label:'Historique chiffrages' },
      { section:'🏪 Achats & Fournisseurs' },
      { page:'produits', icon:'📦', label:'Base produits' },
      { page:'catalogueFournisseurs', icon:'🏪', label:'Catalogue fournisseurs' },
      { page:'tarifs', icon:'💰', label:'Mes prix de vente' },
      { section:'⚙ Paramètres' },
      { page:'monCompte', icon:'👤', label:'Mon compte' },
      { page:'chargesCouts', icon:'📊', label:'Mes charges & coûts' },
      { page:'config', icon:'⚙', label:'Configuration' },
      { page:'legal', icon:'⚖', label:'Mentions légales' },
    ];

    const sidebar = document.getElementById('sidebar-nav');
    sidebar.innerHTML = '';

    nav.forEach(item => {
      if (item.section) {
        const s = document.createElement('div');
        s.className = 'sidebar-section';
        s.innerHTML = '<div class="sidebar-section-title">' + item.section + '</div>';
        sidebar.appendChild(s);
      } else {
        const a = document.createElement('a');
        a.className = 'nav-item';
        a.dataset.page = item.page;
        a.href = '#';
        if (item.accent) {
          a.style.background = 'linear-gradient(135deg,rgba(79,142,247,0.2),rgba(45,212,160,0.12))';
          a.style.borderColor = 'rgba(79,142,247,0.3)';
          a.style.color = 'var(--accent)';
          a.style.fontWeight = '600';
        }
        a.innerHTML = '<span class="nav-icon">' + item.icon + '</span><span>' + item.label + '</span>';
        a.addEventListener('click', function(e) {
          e.preventDefault();
          navigateTo(item.page);
        });
        sidebar.appendChild(a);
      }
    });

    // Fonction de navigation étendue
    function navigateTo(page, params) {
      params = params || {};

      document.querySelectorAll('.nav-item').forEach(function(el) {
        el.classList.remove('active');
      });
      const active = document.querySelector('[data-page="' + page + '"]');
      if (active) active.classList.add('active');

      const titles = {
        dashboard:   'Tableau de bord',
        calculateur: 'Calcul Express',
        clients:     'Clients',
        chantiers:   'Chantiers',
        metrages:    'Métrés',
        cloisons:    '🧱 Cloisons',
        peinture:    '🎨 Peinture',
        devisIntelligent: '📄 Nouveau Devis',
        devis:       'Devis',
        factures:    '🧾 Factures',
        liste_achat: '🛒 Liste d\'achat',
        tarifs:      '💶 Mes Prix de Vente — Grille tarifaire',
        memo:        '✅ Mémo chantier',
        produits:    '🏪 Catalogue Fournisseurs — Prix d\'achat',
        catalogueFournisseurs: '🏪 Catalogue Fournisseurs BTP',
        config:      'Configuration',
        quiz:        '🎮 Quiz Plaquiste',
        quizMetiers: '🏗 Quiz Métiers BTP — Formation professionnelle',
        plaqtetris:  '🎲 PlaqTetris',
        calendrier:  '📅 Calendrier',
        devis_complet: '📋 Devis Complet — Multi-corps',
        projets_types: '📦 Projets types',
        prospection: '🎯 Prospection IA — Permis de construire',
        maconnerie:  '🧱 Pack Maçonnerie',
        electricite: '⚡ Pack Électricité — NF C 15-100',
        plomberie:   '🔧 Pack Plomberie — DTU 60.1 / DTU 60.11',
        sousTraitants: '🤝 Sous-Traitants — Loi 75-1334',
        charges:     '📐 Coefficient de charge — Eurocode 1',
        rentabilite: '💰 Simulateur Marge & Rentabilité',
        acoustique:  '🔊 Calcul Acoustique Rw',
        resistanceFeu: '🔥 Résistance au Feu — EI30 à EI120',
        thermique:     '🌡️ Déperditions Thermiques — RE2020',
        sectionCable:  '💡 Section Câble — NF C15-100',
        tempsChantier: '⏱️ Temps Chantier — Ratios Professionnels',
        linteau:       '🏗️ Dimensionnement Linteau',
        exterieur:            '🌿 Pack Extérieur & Paysagisme',
        cataloguePaysagisme:  '🌿 Catalogue prix paysagisme',
        chantiersPaysagisme:  '🌿 Chantiers extérieurs',
        rapportsPaysagisme:    '🌿 Rapports & marges',
        importCsvPaysagisme:   '🌿 Import CSV / Willemse',
        checklistPaysagisme:   '🌿 Checklists chantier',
        metragePaysagisme:     '🌿 Métrages avancés',
        materielPaysagisme:    '🌿 Parc matériel',
        equipePaysagisme:      '🌿 Mon équipe',
        dpgf:        "🏛 Appels d'offres — Analyse IA",
        aide:        '❓ Guide & Aide',
        chantier_mobile: '🏗 Mode Chantier',
        monCompte:       '👤 Mon Compte',
        chargesCouts:    '💰 Mes Charges & Coûts — Rétro-calcul',
        inscription:     '🚀 Inscription — Qualification métier',
        legal:           '⚖️ Documents Légaux',
      };
      document.getElementById('topbar-title').textContent = titles[page] || page;

      const content = document.getElementById('content');
      content.innerHTML = '';
      content.className = 'content fade-in';

      const pageMap = {
        dashboard:   function() { return Pages.dashboard(); },
        calculateur: function() { return Pages.calculateur(); },
        clients:     function() { return Pages.clients(); },
        chantiers:   function() { return Pages.chantiers(params); },
        metrages:    function() { return Pages.metrages(params); },
        cloisons:    function() { return Pages.cloisons(params); },
        peinture:    function() { return Pages.peinture(params); },
        dpgf:          function() { return Pages.dpgf(); },
        devisIntelligent: function() { return Pages.devisIntelligent(params); },
        devis:         function() { return Pages.devis(params); },
        devis_complet:         function() { return Pages.devisComplet(); },
        listeDevis:            function() { return ListeDevis.render('content'); },
        historiqueChiffrages:  function()       { return HistoriqueChiffrages.render('content'); },
        chiffrageRecap:        function(params) { return CalcExpressRecap.afficherRecap('content', params && params.id); },
        dashboardChiffrages:   function()       { return DashboardChiffrages.render('content'); },
        comparateurChiffrages: function()       { return CalcExpressComparateur.render('content'); },
        listeAchatV2:          function()       { return ListeAchatV2.render('content', [], [], {}); },
        factures:      function() { return Pages.factures(); },
        projets_types: function() { return Pages.projetsTypes(); },
        liste_achat: function() { return Pages.listeAchat(params); },
        tarifs:      function() { return Pages.tarifs(params); },
        memo:        function() { return Pages.memo(params); },
        produits:    function() { return Pages.produits(); },
        catalogueFournisseurs: function() { return Pages.catalogueFournisseurs(); },
        config:      function() { return Pages.config(); },
        quiz:        function() { return Pages.quiz(); },
        quizMetiers: function() { return Pages.quizMetiers(); },
        plaqtetris:  function() { return Pages.plaqtetris(); },
        calendrier:  function() { return Pages.calendrier(); },
        prospection: function() { return Pages.prospection(); },
        maconnerie:  function() { return Pages.maconnerie(); },
        electricite: function() { return Pages.electricite(); },
        plomberie:   function() { return Pages.plomberie(); },
        sousTraitants: function() { return Pages.sousTraitants(); },
        charges:     function() { return Pages.charges(); },
        rentabilite: function() { return Pages.rentabilite(); },
        acoustique:  function() { return Pages.acoustique(); },
        resistanceFeu: function() { return Pages.resistanceFeu(); },
        thermique:     function() { return Pages.thermique(); },
        sectionCable:  function() { return Pages.sectionCable(); },
        tempsChantier: function() { return Pages.tempsChantier(); },
        linteau:       function() { return Pages.linteau(); },
        exterieur:   function() { return Pages.exterieur(); },
        aide:        function() { return Pages.aide(); },
        chantier_mobile: function() { return Pages.chantier_mobile(); },
        monCompte:       function() { return Pages.monCompte(); },
        chargesCouts:    function() { return Pages.chargesCouts(); },
        inscription:     function() { return Pages.inscription(); },
        legal:           function() { return Pages.legal(); },
        paysagisme:           function() { return Pages.paysagisme(); },
        diagnostic:           function() { return Pages.diagnostic(); },
        cataloguePaysagisme:  function() { return Pages.cataloguePaysagisme(); },
        chantiersPaysagisme:  function() { return Pages.chantiersPaysagisme(); },
        rapportsPaysagisme:    function() { return Pages.rapportsPaysagisme(); },
        importCsvPaysagisme:   function() { return Pages.importCsvPaysagisme(); },
        checklistPaysagisme:   function() { return Pages.checklistPaysagisme(); },
        metragePaysagisme:     function() { return Pages.metragePaysagisme(); },
        materielPaysagisme:    function() { return Pages.materielPaysagisme(); },
        equipePaysagisme:      function() { return Pages.equipePaysagisme(); },
        calcExpressV2:         function() { return Pages.calcExpressV2(); },
        calcul:                function() { return Pages.calculateur(); },
      };

      if (pageMap[page]) {
        content.appendChild(pageMap[page]());
      }
    }

    // Remplacer App.navigate
    App.navigate = navigateTo;

    // Fermer sidebar au changement de page sur mobile
    var _origNavigate = navigateTo;
    App.navigate = function(page, params) {
      _origNavigate(page, params);
      App.closeSidebar();
    };

    // Lancer la page initiale (support ?page=xxx depuis login mobile)
    var _initPage = new URLSearchParams(window.location.search).get('page');
    var _forceDesktop = sessionStorage.getItem('plaqpro_force_desktop');
    if (_initPage && !_forceDesktop && typeof pageMap !== 'undefined' && pageMap[_initPage]) {
      navigateTo(_initPage);
    } else {
      sessionStorage.removeItem('plaqpro_force_desktop');
      navigateTo('dashboard');
    }
  });

<script>
// Guard CDN — affiche un avertissement discret si une lib critique est absente
window.addEventListener('DOMContentLoaded', function() {
  var manquants = [];
  if (typeof L === 'undefined')    manquants.push('Leaflet (carte)');
  if (typeof XLSX === 'undefined') manquants.push('Excel (exports)');
  if (typeof QRCode === 'undefined') manquants.push('QR Code');
  if (typeof Chart === 'undefined') manquants.push('Graphiques');
  if (manquants.length > 0 && typeof App !== 'undefined') {
    setTimeout(function() {
      App.toast('⚠️ ' + manquants.join(', ') + ' indisponible(s) hors ligne', 'warning', 3000);
    }, 2000);
  }
});
</script>
