<!DOCTYPE html>
<html lang="fr">
<head>
  <script src="js/config.local.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>PlaqPro+ — Connexion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent:   #4F8EF7;
      --green:    #2DD4A0;
      --orange:   #FF6B00;
      --red:      #F75B5B;
      --bg:       #0D0F14;
      --surface:  #13161E;
      --elevated: #1A1E2A;
      --glass:    rgba(255,255,255,0.05);
      --border:   rgba(255,255,255,0.09);
      --text:     #F0F2F8;
      --muted:    #8892AA;
      --font:     'Outfit', sans-serif;
    }

    html, body {
      height: 100%;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse 80% 60% at 15% 0%, rgba(79,142,247,0.10) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 85% 100%, rgba(45,212,160,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 90% 5%, rgba(255,107,0,0.06) 0%, transparent 50%);
      padding: 20px;
    }

    /* ── Carte de connexion ── */
    .login-card {
      width: 100%;
      max-width: 420px;
      background: rgba(19,22,30,0.92);
      backdrop-filter: blur(32px) saturate(160%);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.7), 0 4px 20px rgba(0,0,0,0.5);
      overflow: hidden;
      position: relative;
    }

    /* Ligne de shine en haut */
    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    }

    /* ── Logo ── */
    .login-logo {
      padding: 32px 32px 24px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
    }

    .login-logo img {
      width: 200px;
      height: auto;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
    }

    .login-logo-text {
      font-size: 13px;
      color: var(--muted);
      margin-top: 8px;
      letter-spacing: 0.05em;
    }

    /* ── Corps ── */
    .login-body {
      padding: 28px 32px 32px;
    }

    .login-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }

    .login-sub {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 24px;
    }

    /* ── Champs ── */
    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 8px;
    }

    .input-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 12px;
      padding: 0 14px;
      transition: border-color 0.15s, box-shadow 0.15s;
      box-shadow: inset 0 1px 4px rgba(0,0,0,0.3);
    }

    .input-wrap:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79,142,247,0.18), inset 0 1px 4px rgba(0,0,0,0.2);
    }

    .input-icon {
      font-size: 16px;
      flex-shrink: 0;
      opacity: 0.5;
    }

    .input-wrap input {
      flex: 1;
      height: 46px;
      background: none;
      border: none;
      outline: none;
      font-family: var(--font);
      font-size: 15px;
      color: var(--text);
    }

    .input-wrap input::placeholder { color: rgba(136,146,170,0.5); }

    .input-toggle {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: 16px;
      padding: 4px;
      border-radius: 6px;
      transition: color 0.12s;
      flex-shrink: 0;
    }
    .input-toggle:hover { color: var(--text); }

    /* ── Message d'erreur ── */
    .login-error {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: rgba(247,91,91,0.12);
      border: 1px solid rgba(247,91,91,0.25);
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 13px;
      color: var(--red);
      animation: shake 0.3s ease;
    }

    .login-error.visible { display: flex; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25%       { transform: translateX(-6px); }
      75%       { transform: translateX(6px); }
    }

    /* ── Bouton ── */
    .btn-login {
      width: 100%;
      height: 50px;
      background: linear-gradient(135deg, #5B9BFF, #3B7DE8);
      color: white;
      border: 1px solid rgba(79,142,247,0.3);
      border-radius: 12px;
      font-family: var(--font);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s ease;
      box-shadow: 0 4px 16px rgba(79,142,247,0.4), inset 0 1px 0 rgba(255,255,255,0.15);
      margin-top: 8px;
      position: relative;
      overflow: hidden;
      letter-spacing: 0.02em;
    }

    .btn-login::after {
      content: '';
      position: absolute;
      top: 0; left: -100%; width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
      transition: left 0.5s ease;
    }

    .btn-login:hover {
      background: linear-gradient(135deg, #6BABFF, #4F8EF7);
      box-shadow: 0 6px 25px rgba(79,142,247,0.55), inset 0 1px 0 rgba(255,255,255,0.2);
      transform: translateY(-1px);
    }

    .btn-login:hover::after { left: 150%; }
    .btn-login:active { transform: translateY(0); }

    .btn-login:disabled {
      opacity: 0.5;
      cursor: default;
      transform: none;
    }

    /* ── Spinner ── */
    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Pied ── */
    .login-footer {
      padding: 16px 32px 24px;
      text-align: center;
      font-size: 11px;
      color: rgba(136,146,170,0.4);
      border-top: 1px solid var(--border);
    }

    /* ── Tentatives bloquées ── */
    .login-blocked {
      display: none;
      text-align: center;
      padding: 16px;
      background: rgba(247,91,91,0.08);
      border-radius: 10px;
      margin-bottom: 16px;
    }

    .login-blocked.visible { display: block; }
    .countdown { font-size: 24px; font-weight: 800; color: var(--red); }
  </style>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0D0F14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PlaqPro+">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
</head>
<body>

  <div class="login-card">

    <!-- Logo -->
    <div class="login-logo">
      <img src="assets/logo_plaqpro.png" alt="PlaqPro+" onerror="this.style.display='none';document.getElementById('logo-fallback').style.display='block'">
      <div id="logo-fallback" style="display:none;font-size:28px;font-weight:900;background:linear-gradient(135deg,#4F8EF7,#2DD4A0);-webkit-background-clip:text;-webkit-text-fill-color:transparent">
        PlaQPro+
      </div>
      <div class="login-logo-text">ERP Plaquiste & Peinture</div>
    </div>

    <!-- Corps -->
    <div class="login-body">
      <div class="login-title">Connexion</div>
      <div class="login-sub">Accès réservé aux utilisateurs autorisés</div>

      <!-- Erreur -->
      <div class="login-error" id="login-error">
        <span>⚠️</span>
        <span id="login-error-msg">Identifiant ou mot de passe incorrect</span>
      </div>

      <!-- Blocage -->
      <div class="login-blocked" id="login-blocked">
        <div style="font-size:13px;color:var(--red);margin-bottom:4px">Trop de tentatives échouées</div>
        <div class="countdown" id="countdown">30</div>
        <div style="font-size:12px;color:var(--muted);margin-top:4px">secondes avant de réessayer</div>
      </div>

      <!-- Formulaire -->
      <form id="login-form" onsubmit="Auth.login(event)">
        <div class="form-group">
          <label class="form-label">Identifiant</label>
          <div class="input-wrap">
            <span class="input-icon">👤</span>
            <input type="text" id="login-user" placeholder="Votre identifiant"
              autocomplete="username" spellcheck="false" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Mot de passe</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" id="login-pass" placeholder="••••••••"
              autocomplete="current-password" required>
            <button type="button" class="input-toggle" onclick="Auth.togglePass()" id="toggle-pass" title="Afficher/masquer">👁</button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="btn-login">
          <span id="btn-login-text">Se connecter</span>
          <div class="spinner" id="btn-spinner"></div>
        </button>
      </form>
    </div>

    <div class="login-footer">
      PlaqPro+ · By aatb · v2.0 · © 2026
    </div>
  </div>

  <script>
  const Auth = {

    // ── Utilisateurs (hash SHA-256 des mots de passe) ────────
    USERS: [
      { user: 'admin',    hash: '3723c651762632813dbd296aa9f7cd71fdc077fe6028d2e9346e065bb408f1b4', role: 'admin', nom: 'Administrateur' },
      { user: 'gabriel',  hash: '3723c651762632813dbd296aa9f7cd71fdc077fe6028d2e9346e065bb408f1b4', role: 'admin', nom: 'Gabriel' },
      { user: 'testeur1', hash: '3006598f50d096cb201b8955a2519c28707b588d54ab034cf857769b8da675a3', role: 'user',  nom: 'Testeur 1' },
      { user: 'testeur2', hash: '3006598f50d096cb201b8955a2519c28707b588d54ab034cf857769b8da675a3', role: 'user',  nom: 'Testeur 2' },
    ],

    MAX_TENTATIVES: 5,
    BLOCAGE_SEC: 30,
    _tentatives: 0,
    _bloque: false,

    // ── Hash SHA-256 simplifié (pour démo — en prod utiliser bcrypt côté serveur) ──
    async hash(str) {
      const buf  = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    },

    // ── Connexion ─────────────────────────────────────────────
    async login(e) {
      e.preventDefault();
      if (this._bloque) return;

      const user = document.getElementById('login-user').value.trim().toLowerCase();
      const pass = document.getElementById('login-pass').value;

      if (!user || !pass) {
        this.erreur('Veuillez remplir tous les champs');
        return;
      }

      // Animation chargement
      this.setLoading(true);
      await new Promise(r => setTimeout(r, 600)); // délai UX

      const hashSaisi = await this.hash(pass);
      const compte = this.USERS.find(u => u.user === user);

      const passwordOk = compte && compte.hash === hashSaisi;

      if (passwordOk) {
        this.succes(compte);
      } else {
        this._tentatives++;
        this.setLoading(false);

        if (this._tentatives >= this.MAX_TENTATIVES) {
          this.bloquer();
        } else {
          const restants = this.MAX_TENTATIVES - this._tentatives;
          this.erreur(`Identifiant ou mot de passe incorrect (${restants} tentative${restants > 1 ? 's' : ''} restante${restants > 1 ? 's' : ''})`);
          document.getElementById('login-pass').value = '';
          document.getElementById('login-pass').focus();
        }
      }
    },

    // ── Succès connexion ─────────────────────────────────────
    succes(compte) {
      // Stocker la session
      sessionStorage.setItem('plaqpro_session', JSON.stringify({
        user:      compte.user,
        nom:       compte.nom,
        role:      compte.role,
        loginAt:   new Date().toISOString(),
        expiresAt: new Date(Date.now() + 8 * 3600000).toISOString(), // 8h
      }));

      // Animation succès
      const btn = document.getElementById('btn-login');
      btn.style.background = 'linear-gradient(135deg, #2DD4A0, #22B589)';
      btn.style.boxShadow  = '0 4px 20px rgba(45,212,160,0.5)';
      document.getElementById('btn-login-text').textContent = '✓ Connecté — redirection...';

      setTimeout(() => {
        const isMobile = window.innerWidth < 768;
        window.location.href = isMobile ? 'index.html?page=chantier_mobile' : 'index.html';
      }, 800);
    },

    // ── Erreur ───────────────────────────────────────────────
    erreur(msg) {
      const el = document.getElementById('login-error');
      document.getElementById('login-error-msg').textContent = msg;
      el.classList.remove('visible');
      void el.offsetWidth; // reset animation
      el.classList.add('visible');
    },

    // ── Blocage temporaire ────────────────────────────────────
    bloquer() {
      this._bloque = true;
      document.getElementById('login-error').classList.remove('visible');
      document.getElementById('login-blocked').classList.add('visible');
      document.getElementById('btn-login').disabled = true;
      document.getElementById('login-form').style.opacity = '0.4';
      document.getElementById('login-form').style.pointerEvents = 'none';

      let restant = this.BLOCAGE_SEC;
      const interval = setInterval(() => {
        restant--;
        document.getElementById('countdown').textContent = restant;
        if (restant <= 0) {
          clearInterval(interval);
          this._bloque = false;
          this._tentatives = 0;
          document.getElementById('login-blocked').classList.remove('visible');
          document.getElementById('btn-login').disabled = false;
          document.getElementById('login-form').style.opacity = '1';
          document.getElementById('login-form').style.pointerEvents = 'auto';
        }
      }, 1000);
    },

    // ── Afficher/masquer mot de passe ────────────────────────
    togglePass() {
      const inp = document.getElementById('login-pass');
      const btn = document.getElementById('toggle-pass');
      if (inp.type === 'password') {
        inp.type = 'text';
        btn.textContent = '🙈';
      } else {
        inp.type = 'password';
        btn.textContent = '👁';
      }
    },

    // ── Loading ───────────────────────────────────────────────
    setLoading(on) {
      const btn  = document.getElementById('btn-login');
      const txt  = document.getElementById('btn-login-text');
      const spin = document.getElementById('btn-spinner');
      btn.disabled  = on;
      txt.style.display  = on ? 'none' : 'block';
      spin.style.display = on ? 'block' : 'none';
    },
  };

  // Focus automatique
  document.getElementById('login-user').focus();

  // Enter sur champ username → passe au mot de passe
  document.getElementById('login-user').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      document.getElementById('login-pass').focus();
    }
  });
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    }
    // Paramètre page au démarrage depuis shortcut PWA
    const urlParams = new URLSearchParams(window.location.search);
    const startPage = urlParams.get('page');
    if (startPage && typeof App !== 'undefined') {
      document.addEventListener('DOMContentLoaded', () => setTimeout(() => App.navigate(startPage), 500));
    }
  </script>
</body>
</html>
